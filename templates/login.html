<!DOCTYPE html>
<html>
<head>

    <title>Admin Login | Shinedoor</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 380px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            letter-spacing: 2px;
        }

        p {
            text-align: center;
            color: #888;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;

            background: #050505;
            border: 1px solid #333;
            border-radius: 8px;

            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;

            border: none;
            border-radius: 25px;

            background: white;
            color: black;

            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff7070;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>SHINEDOOR</h1>

    <p>Admin Dashboard</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
